name: Build GFX1013 Patched Kernel + Mesa

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no changes detected"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BASE_IMAGE: "ghcr.io/ublue-os/bazzite:stable"
  UPSTREAM_REPO: "https://github.com/DryhoppedIPA/bc250-gfx1013-fix.git"

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      kernel_changed: ${{ steps.detect.outputs.kernel_changed }}
      mesa_changed: ${{ steps.detect.outputs.mesa_changed }}
      base_kernel: ${{ steps.base-info.outputs.kernel_version }}
      base_mesa: ${{ steps.base-info.outputs.mesa_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get base image info
        id: base-info
        run: |
          podman pull "$BASE_IMAGE" 2>/dev/null || docker pull "$BASE_IMAGE"
          KERNEL=$(podman run --rm "$BASE_IMAGE" uname -r 2>/dev/null || docker run --rm "$BASE_IMAGE" uname -r)
          MESA=$(podman run --rm "$BASE_IMAGE" rpm -q mesa-vulkan-drivers --queryformat '%{VERSION}-%{RELEASE}' 2>/dev/null || \
                 docker run --rm "$BASE_IMAGE" rpm -q mesa-vulkan-drivers --queryformat '%{VERSION}-%{RELEASE}')
          echo "kernel_version=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "mesa_version=$MESA" >> "$GITHUB_OUTPUT"
          echo "Kernel: $KERNEL | Mesa: $MESA"

      - name: Check upstream
        run: |
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          LATEST=$(git ls-remote "$UPSTREAM_REPO" main | awk '{print $1}')
          echo "Pinned: ${PINNED:0:8} | Latest: ${LATEST:0:8}"
          [[ "$PINNED" != "$LATEST" ]] && echo "⚠️  Upstream has newer commits"

      - name: Detect changes
        id: detect
        run: |
          mkdir -p .base-digests
          echo "${{ steps.base-info.outputs.kernel_version }}" > .base-digests/current-kernel.txt
          echo "${{ steps.base-info.outputs.mesa_version }}" > .base-digests/current-mesa.txt

          PREV_KERNEL=$(cat .base-digests/previous-kernel.txt 2>/dev/null || echo "")
          PREV_MESA=$(cat .base-digests/previous-mesa.txt 2>/dev/null || echo "")
          CURR_KERNEL="${{ steps.base-info.outputs.kernel_version }}"
          CURR_MESA="${{ steps.base-info.outputs.mesa_version }}"
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          PREV_PINNED=$(cat .base-digests/previous-upstream.txt 2>/dev/null || echo "")

          kernel_changed="false"; mesa_changed="false"; should_build="false"
          [[ "$PREV_KERNEL" != "$CURR_KERNEL" || "$PREV_MESA" != "$CURR_MESA" ]] && kernel_changed="true" && mesa_changed="true" && should_build="true"
          [[ "$PINNED" != "$PREV_PINNED" ]] && should_build="true" && kernel_changed="true" && mesa_changed="true"
          [[ "${{ github.event.inputs.force_build }}" == "true" ]] && should_build="true" && kernel_changed="true" && mesa_changed="true"

          echo "kernel_changed=$kernel_changed" >> "$GITHUB_OUTPUT"
          echo "mesa_changed=$mesa_changed" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build-kernel:
    name: Build patched amdgpu.ko
    needs: detect-changes
    if: needs.detect-changes.outputs.kernel_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read upstream commit
        id: upstream
        run: |
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          echo "commit=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Upstream: $PINNED"

      - run: sudo apt-get update && sudo apt-get install -y podman

      - uses: actions/cache@v4
        with:
          path: /tmp/upstream-fix-cache
          key: upstream-patches-${{ steps.upstream.outputs.commit }}

      - uses: actions/cache@v4
        with:
          path: /tmp/kernel-src-cache
          key: kernel-source-${{ needs.detect-changes.outputs.base_kernel }}

      - uses: actions/cache@v4
        with:
          path: /tmp/bazzite-image-cache
          key: bazzite-base-${{ needs.detect-changes.outputs.base_kernel }}

      - name: Build amdgpu.ko
        run: |
          set -euo pipefail
          KERNEL_VER="${{ needs.detect-changes.outputs.base_kernel }}"
          UPSTREAM_COMMIT="${{ steps.upstream.outputs.commit }}"
          echo "Kernel: $KERNEL_VER | Upstream: $UPSTREAM_COMMIT"

          mkdir -p output /tmp/upstream-fix-cache /tmp/bazzite-image-cache /tmp/kernel-src-cache

          # Load/save Bazzite image cache
          [[ -f /tmp/bazzite-image-cache/bazzite.tar ]] && podman load -i /tmp/bazzite-image-cache/bazzite.tar 2>/dev/null || true
          podman pull "$BASE_IMAGE" 2>/dev/null || true
          podman save "$BASE_IMAGE" -o /tmp/bazzite-image-cache/bazzite.tar 2>/dev/null || true

          podman run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -v /tmp/upstream-fix-cache:/upstream-fix:rw \
            -v /tmp/kernel-src-cache:/kernel-src-cache:rw \
            -e KERNEL_VER="$KERNEL_VER" \
            -e UPSTREAM_COMMIT="$UPSTREAM_COMMIT" \
            -e UPSTREAM_REPO="$UPSTREAM_REPO" \
            "$BASE_IMAGE" bash -c '
              set -euo pipefail
              echo "=== Installing build deps ==="
              dnf install -y kernel-devel-"$KERNEL_VER" gcc make flex bison elfutils-libelf-devel openssl-devel bc perl 2>/dev/null || \
                rpm-ostree install -y kernel-devel-"$KERNEL_VER" gcc make flex bison elfutils-libelf-devel openssl-devel bc perl

              echo "=== Upstream patches ==="
              if [[ ! -d /upstream-fix/patches ]]; then
                git clone "$UPSTREAM_REPO" /upstream-fix
                cd /upstream-fix
                git fetch --depth=1 origin "$UPSTREAM_COMMIT"
                git checkout FETCH_HEAD
              fi
              cd /upstream-fix
              git fetch --depth=1 origin "$UPSTREAM_COMMIT" 2>/dev/null || true
              git checkout "$UPSTREAM_COMMIT" 2>/dev/null || git checkout FETCH_HEAD
              echo "Upstream: $(git rev-parse HEAD)"

              echo "=== Kernel source ==="
              if [[ ! -d /kernel-src-cache/drivers ]]; then
                git clone --depth=1 --branch bazzite https://github.com/hhd-dev/kernel-bazzite.git /kernel-src-cache 2>/dev/null || \
                  git clone --depth=1 https://github.com/ublue-os/kernel-bazzite.git /kernel-src-cache
              fi
              cd /kernel-src-cache
              echo "Kernel: $(head -1 Makefile)"

              echo "=== Applying patches ==="
              for p in /upstream-fix/patches/kernel/v33/*.patch; do
                echo "  $(basename "$p")"
                patch -p1 < "$p"
              done

              echo "=== Building amdgpu.ko ==="
              make -C /lib/modules/"$KERNEL_VER"/build M="$PWD/drivers/gpu/drm/amd/amdgpu" -j"$(nproc)" modules
              mkdir -p /output
              cp drivers/gpu/drm/amd/amdgpu/amdgpu.ko /output/
              echo "✅ amdgpu.ko built"
              ls -lh /output/amdgpu.ko
            '

      - uses: actions/upload-artifact@v4
        with:
          name: amdgpu-patched
          path: output/amdgpu.ko
          retention-days: 7

  build-mesa:
    name: Build patched RADV
    needs: detect-changes
    if: needs.detect-changes.outputs.mesa_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read upstream commit
        id: upstream
        run: |
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          echo "commit=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Upstream: $PINNED"

      - run: sudo apt-get update && sudo apt-get install -y podman

      - uses: actions/cache@v4
        with:
          path: /tmp/upstream-fix-cache
          key: upstream-patches-${{ steps.upstream.outputs.commit }}

      - uses: actions/cache@v4
        with:
          path: /tmp/mesa-tarball
          key: mesa-tarball-${{ needs.detect-changes.outputs.base_mesa }}

      - uses: actions/cache@v4
        with:
          path: /tmp/fedora-image-cache
          key: fedora-43-base

      - name: Build RADV
        run: |
          set -euo pipefail
          MESA_FULL="${{ needs.detect-changes.outputs.base_mesa }}"
          MESA_VER=$(echo "$MESA_FULL" | sed 's/-[0-9].*//')
          MESA_URL="https://gitlab.freedesktop.org/mesa/mesa/-/archive/mesa-${MESA_VER}/mesa-mesa-${MESA_VER}.tar.gz"
          UPSTREAM_COMMIT="${{ steps.upstream.outputs.commit }}"
          echo "Mesa: $MESA_VER | Upstream: $UPSTREAM_COMMIT"

          mkdir -p output /tmp/upstream-fix-cache /tmp/mesa-tarball /tmp/fedora-image-cache

          # Cache Fedora image
          [[ -f /tmp/fedora-image-cache/fedora.tar ]] && podman load -i /tmp/fedora-image-cache/fedora.tar 2>/dev/null || true
          podman pull registry.fedoraproject.org/fedora:43 2>/dev/null || true
          podman save registry.fedoraproject.org/fedora:43 -o /tmp/fedora-image-cache/fedora.tar 2>/dev/null || true

          # Cache Mesa tarball
          [[ -f /tmp/mesa-tarball/mesa.tar.gz ]] || curl -fsSL -o /tmp/mesa-tarball/mesa.tar.gz "$MESA_URL"

          podman run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -v /tmp/upstream-fix-cache:/upstream-fix:rw \
            -v /tmp/mesa-tarball/mesa.tar.gz:/mesa.tar.gz:ro \
            -e MESA_VERSION="$MESA_VER" \
            -e UPSTREAM_COMMIT="$UPSTREAM_COMMIT" \
            -e UPSTREAM_REPO="$UPSTREAM_REPO" \
            registry.fedoraproject.org/fedora:43 bash -c '
              set -euo pipefail
              echo "=== Installing build deps ==="
              dnf install -y gcc gcc-c++ meson ninja-build python3 python3-mako \
                vulkan-headers vulkan-loader-devel libdrm-devel elfutils-libelf-devel \
                expat-devel zlib-ng-devel llvm-devel glslang \
                git patch tar xz which make

              echo "=== Upstream patches ==="
              if [[ ! -d /upstream-fix/patches ]]; then
                git clone "$UPSTREAM_REPO" /upstream-fix
                cd /upstream-fix
                git fetch --depth=1 origin "$UPSTREAM_COMMIT"
                git checkout FETCH_HEAD
              fi
              cd /upstream-fix
              git fetch --depth=1 origin "$UPSTREAM_COMMIT" 2>/dev/null || true
              git checkout "$UPSTREAM_COMMIT" 2>/dev/null || git checkout FETCH_HEAD
              echo "Upstream: $(git rev-parse HEAD)"

              echo "=== Extracting Mesa ==="
              cd /tmp && tar xf /mesa.tar.gz
              cd mesa-mesa-*

              echo "=== Applying patches ==="
              while IFS= read -r line; do
                [[ "$line" =~ ^[[:space:]]*# ]] && continue
                [[ -z "${line// /}" ]] && continue
                echo "  $(basename "/upstream-fix/patches/mesa/$line")"
                patch -p1 < "/upstream-fix/patches/mesa/$(echo "$line" | xargs)"
              done < /upstream-fix/patches/mesa/series

              echo "=== Building RADV ==="
              meson setup build -Dvulkan-drivers=amd -Dgallium-drivers= -Dglx=disabled -Dllvm=disabled -Dbuildtype=release -Dprefix=/opt/bc250-gfx1013
              ninja -C build
              DESTDIR=/output ninja -C build install
              [[ -f /output/opt/bc250-gfx1013/share/vulkan/icd.d/radeon_icd.x86_64.json ]] && \
                cp /output/opt/bc250-gfx1013/share/vulkan/icd.d/radeon_icd.x86_64.json /output/
              echo "✅ RADV built"
              du -sh /output/opt/bc250-gfx1013/
            '

      - uses: actions/upload-artifact@v4
        with:
          name: radv-patched
          path: output/
          retention-days: 7

  verify:
    name: Verify builds
    needs: [detect-changes, build-kernel, build-mesa]
    if: always() && (needs.build-kernel.result == 'success' || needs.build-mesa.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: amdgpu-patched, path: output/ }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: radv-patched, path: output/ }
        continue-on-error: true
      - run: |
          echo "=== Verification ==="
          [[ -f output/amdgpu.ko ]] && echo "✅ amdgpu.ko" || echo "⚠️  amdgpu.ko not built"
          [[ -d output/opt ]] && echo "✅ RADV tree" || echo "⚠️  RADV not built"
          [[ -f output/radeon_icd.x86_64.json ]] && echo "✅ ICD manifest"
          echo "=== Phase 0 complete ==="

  save-digests:
    name: Save digests
    needs: [detect-changes, verify]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .base-digests
          echo "${{ needs.detect-changes.outputs.base_kernel }}" > .base-digests/previous-kernel.txt
          echo "${{ needs.detect-changes.outputs.base_mesa }}" > .base-digests/previous-mesa.txt
          grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}' > .base-digests/previous-upstream.txt
          echo "Saved."

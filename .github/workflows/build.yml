name: Build GFX1013 Patched Kernel + Mesa

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no changes detected"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BASE_IMAGE: "ghcr.io/ublue-os/bazzite:stable"
  UPSTREAM_REPO: "https://github.com/DryhoppedIPA/bc250-gfx1013-fix.git"

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Detect what changed
  # ──────────────────────────────────────────────
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      kernel_changed: ${{ steps.detect.outputs.kernel_changed }}
      mesa_changed: ${{ steps.detect.outputs.mesa_changed }}
      base_kernel: ${{ steps.base-info.outputs.kernel_version }}
      base_mesa: ${{ steps.base-info.outputs.mesa_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get base image info
        id: base-info
        run: |
          # Cache the base image pull
          CACHE_KEY="base-image-$(date +%Y%m%d)"
          if podman image exists "$BASE_IMAGE" 2>/dev/null; then
            echo "Base image already cached locally."
          else
            podman pull "$BASE_IMAGE" 2>/dev/null || docker pull "$BASE_IMAGE"
          fi
          
          KERNEL=$(podman run --rm "$BASE_IMAGE" uname -r 2>/dev/null || \
                   docker run --rm "$BASE_IMAGE" uname -r)
          MESA=$(podman run --rm "$BASE_IMAGE" \
            rpm -q mesa-vulkan-drivers --queryformat '%{VERSION}-%{RELEASE}' 2>/dev/null || \
                   docker run --rm "$BASE_IMAGE" \
            rpm -q mesa-vulkan-drivers --queryformat '%{VERSION}-%{RELEASE}')
          
          echo "kernel_version=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "mesa_version=$MESA" >> "$GITHUB_OUTPUT"
          echo "Base kernel: $KERNEL"
          echo "Base Mesa: $MESA"

      - name: Check upstream patches
        id: upstream
        run: |
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          echo "Pinned upstream commit: $PINNED"
          
          LATEST=$(git ls-remote "${{ env.UPSTREAM_REPO }}" main | awk '{print $1}')
          echo "Latest upstream commit: $LATEST"
          
          if [[ "$PINNED" != "$LATEST" ]]; then
            echo "⚠️  Upstream has new commits (pinned: ${PINNED:0:8}, latest: ${LATEST:0:8})"
          else
            echo "✅ Upstream patches are current."
          fi

      - name: Detect changes
        id: detect
        run: |
          mkdir -p .base-digests
          
          echo "${{ steps.base-info.outputs.kernel_version }}" > .base-digests/current-kernel.txt
          echo "${{ steps.base-info.outputs.mesa_version }}" > .base-digests/current-mesa.txt
          
          PREV_KERNEL=""
          PREV_MESA=""
          [[ -f ".base-digests/previous-kernel.txt" ]] && PREV_KERNEL=$(cat .base-digests/previous-kernel.txt)
          [[ -f ".base-digests/previous-mesa.txt" ]] && PREV_MESA=$(cat .base-digests/previous-mesa.txt)
          
          CURR_KERNEL="${{ steps.base-info.outputs.kernel_version }}"
          CURR_MESA="${{ steps.base-info.outputs.mesa_version }}"
          
          kernel_changed="false"
          mesa_changed="false"
          should_build="false"
          
          if [[ "$PREV_KERNEL" != "$CURR_KERNEL" || "$PREV_MESA" != "$CURR_MESA" ]]; then
            kernel_changed="true"
            mesa_changed="true"
            should_build="true"
            echo "Base image changed."
          fi
          
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          PREV_PINNED=""
          [[ -f ".base-digests/previous-upstream.txt" ]] && PREV_PINNED=$(cat ".base-digests/previous-upstream.txt")
          
          if [[ "$PINNED" != "$PREV_PINNED" ]]; then
            should_build="true"
            kernel_changed="true"
            mesa_changed="true"
            echo "Upstream patches changed."
          fi
          
          if [[ "${{ github.event.inputs.force_build }}" == "true" ]]; then
            should_build="true"
            kernel_changed="true"
            mesa_changed="true"
            echo "Force build requested."
          fi
          
          echo "kernel_changed=$kernel_changed" >> "$GITHUB_OUTPUT"
          echo "mesa_changed=$mesa_changed" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Stage 2: Build patched amdgpu.ko
  # ──────────────────────────────────────────────
  build-kernel:
    name: Build patched amdgpu.ko
    needs: detect-changes
    if: needs.detect-changes.outputs.kernel_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned upstream commit
        id: upstream
        run: |
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          echo "commit=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $PINNED"

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      # ── Cache: upstream patches repo ──
      - name: Cache upstream patches
        uses: actions/cache@v4
        with:
          path: /tmp/upstream-fix-cache
          key: upstream-patches-${{ steps.upstream.outputs.commit }}

      # ── Cache: kernel source ──
      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: /tmp/kernel-src-cache
          key: kernel-source-${{ needs.detect-changes.outputs.base_kernel }}-bazzite

      # ── Cache: Bazzite base image layers ──
      - name: Cache Bazzite container
        uses: actions/cache@v4
        with:
          path: /tmp/bazzite-image-cache
          key: bazzite-base-${{ needs.detect-changes.outputs.base_kernel }}

      - name: Build amdgpu.ko in Bazzite container
        run: |
          set -euo pipefail
          
          KERNEL_VER="${{ needs.detect-changes.outputs.base_kernel }}"
          UPSTREAM_COMMIT="${{ steps.upstream.outputs.commit }}"
          echo "Target kernel: $KERNEL_VER"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          
          mkdir -p output
          
          # Load cached Bazzite image if available
          if [[ -f /tmp/bazzite-image-cache/bazzite.tar ]]; then
            echo "Loading cached Bazzite image..."
            podman load -i /tmp/bazzite-image-cache/bazzite.tar 2>/dev/null || true
          fi
          
          # Save image cache for next run
          mkdir -p /tmp/bazzite-image-cache
          podman pull "${{ env.BASE_IMAGE }}" 2>/dev/null || true
          podman save "${{ env.BASE_IMAGE }}" -o /tmp/bazzite-image-cache/bazzite.tar 2>/dev/null || true
          
          podman run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -v /tmp/upstream-fix-cache:/upstream-fix:ro \
            -v /tmp/kernel-src-cache:/kernel-src-cache:rw \
            -e KERNEL_VER="$KERNEL_VER" \
            -e UPSTREAM_COMMIT="$UPSTREAM_COMMIT" \
            -e UPSTREAM_REPO="${{ env.UPSTREAM_REPO }}" \
            "${{ env.BASE_IMAGE }}" \
            bash -c '
              set -euo pipefail
              
              echo "=== Installing build deps ==="
              dnf install -y \
                kernel-devel-"$KERNEL_VER" \
                gcc make flex bison elfutils-libelf-devel \
                openssl-devel bc perl \
                2>/dev/null || {
                rpm-ostree install -y \
                  kernel-devel-"$KERNEL_VER" \
                  gcc make flex bison elfutils-libelf-devel \
                  openssl-devel bc perl
              }
              
              echo "=== Cloning upstream patches (cached) ==="
              if [[ ! -d /upstream-fix/.git ]]; then
                git clone "$UPSTREAM_REPO" /upstream-fix
                cd /upstream-fix
                git fetch --depth=1 origin "$UPSTREAM_COMMIT"
                git checkout "$FETCH_HEAD"
              else
                cd /upstream-fix
                git fetch --depth=1 origin "$UPSTREAM_COMMIT" 2>/dev/null || true
                git checkout "$UPSTREAM_COMMIT" 2>/dev/null || git checkout "$FETCH_HEAD"
              fi
              echo "Upstream commit: $(git rev-parse HEAD)"
              ls -la patches/kernel/v33/
              
              echo "=== Cloning kernel source (cached) ==="
              if [[ ! -d /kernel-src-cache/.git ]]; then
                git clone --depth=1 --branch bazzite \
                  https://github.com/hhd-dev/kernel-bazzite.git \
                  /kernel-src-cache 2>/dev/null || \
                git clone --depth=1 \
                  https://github.com/ublue-os/kernel-bazzite.git \
                  /kernel-src-cache
              fi
              
              cd /kernel-src-cache
              echo "Kernel version: $(head -1 Makefile)"
              
              echo "=== Applying kernel patches ==="
              for p in /upstream-fix/patches/kernel/v33/*.patch; do
                echo "Applying: $(basename "$p")"
                patch -p1 < "$p"
              done
              echo "All kernel patches applied."
              
              echo "=== Building amdgpu.ko ==="
              AMDGPU_DIR="$PWD/drivers/gpu/drm/amd/amdgpu"
              make -C /lib/modules/"$KERNEL_VER"/build \
                M="$AMDGPU_DIR" -j"$(nproc)" modules
              
              mkdir -p /output
              cp "$AMDGPU_DIR/amdgpu.ko" /output/
              echo "amdgpu.ko built successfully."
              ls -lh /output/amdgpu.ko
            '
          
          ls -lh output/

      - name: Upload amdgpu.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: amdgpu-patched
          path: output/amdgpu.ko
          retention-days: 7

  # ──────────────────────────────────────────────
  # Stage 3: Build patched RADV
  # ──────────────────────────────────────────────
  build-mesa:
    name: Build patched RADV
    needs: detect-changes
    if: needs.detect-changes.outputs.mesa_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned upstream commit
        id: upstream
        run: |
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          echo "commit=$PINNED" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $PINNED"

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      # ── Cache: upstream patches repo ──
      - name: Cache upstream patches
        uses: actions/cache@v4
        with:
          path: /tmp/upstream-fix-cache
          key: upstream-patches-${{ steps.upstream.outputs.commit }}

      # ── Cache: Mesa tarball ──
      - name: Determine Mesa version
        id: mesa-ver
        run: |
          MESA_FULL="${{ needs.detect-changes.outputs.base_mesa }}"
          MESA_VER=$(echo "$MESA_FULL" | sed 's/-[0-9].*//')
          MESA_TARBALL_URL="https://gitlab.freedesktop.org/mesa/mesa/-/archive/mesa-${MESA_VER}/mesa-mesa-${MESA_VER}.tar.gz"
          echo "version=$MESA_VER" >> "$GITHUB_OUTPUT"
          echo "tarball_url=$MESA_TARBALL_URL" >> "$GITHUB_OUTPUT"
          echo "Mesa version: $MESA_VER"

      - name: Cache Mesa tarball
        uses: actions/cache@v4
        with:
          path: /tmp/mesa-tarball
          key: mesa-tarball-${{ steps.mesa-ver.outputs.version }}

      # ── Cache: Fedora container + dnf ──
      - name: Cache Fedora container
        uses: actions/cache@v4
        with:
          path: /tmp/fedora-image-cache
          key: fedora-43-base

      - name: Build RADV in Fedora container
        run: |
          set -euo pipefail
          
          MESA_VER="${{ steps.mesa-ver.outputs.version }}"
          MESA_TARBALL_URL="${{ steps.mesa-ver.outputs.tarball_url }}"
          UPSTREAM_COMMIT="${{ steps.upstream.outputs.commit }}"
          echo "Mesa version: $MESA_VER"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          
          mkdir -p output
          
          # Cache Fedora image
          if [[ -f /tmp/fedora-image-cache/fedora.tar ]]; then
            echo "Loading cached Fedora image..."
            podman load -i /tmp/fedora-image-cache/fedora.tar 2>/dev/null || true
          fi
          mkdir -p /tmp/fedora-image-cache
          podman pull registry.fedoraproject.org/fedora:43 2>/dev/null || true
          podman save registry.fedoraproject.org/fedora:43 -o /tmp/fedora-image-cache/fedora.tar 2>/dev/null || true
          
          # Cache Mesa tarball
          mkdir -p /tmp/mesa-tarball
          if [[ ! -f /tmp/mesa-tarball/mesa.tar.gz ]]; then
            echo "Downloading Mesa tarball..."
            curl -fsSL -o /tmp/mesa-tarball/mesa.tar.gz "$MESA_TARBALL_URL"
          else
            echo "Using cached Mesa tarball."
          fi
          
          podman run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -v /tmp/upstream-fix-cache:/upstream-fix:ro \
            -v /tmp/mesa-tarball/mesa.tar.gz:/mesa.tar.gz:ro \
            -e MESA_VERSION="$MESA_VER" \
            -e UPSTREAM_COMMIT="$UPSTREAM_COMMIT" \
            -e UPSTREAM_REPO="${{ env.UPSTREAM_REPO }}" \
            registry.fedoraproject.org/fedora:43 \
            bash -c '
              set -euo pipefail
              
              echo "=== Installing build deps ==="
              dnf install -y \
                gcc gcc-c++ meson ninja-build \
                python3 python3-mako python3-pycparser \
                vulkan-headers vulkan-loader-devel \
                libdrm-devel elfutils-libelf-devel \
                expat-devel zlib-ng-devel \
                llvm-devel glslang \
                git patch tar xz findutils coreutils diffutils \
                which make
              
              echo "=== Cloning upstream patches (cached) ==="
              if [[ ! -d /upstream-fix/.git ]]; then
                git clone "$UPSTREAM_REPO" /upstream-fix
                cd /upstream-fix
                git fetch --depth=1 origin "$UPSTREAM_COMMIT"
                git checkout "$FETCH_HEAD"
              else
                cd /upstream-fix
                git fetch --depth=1 origin "$UPSTREAM_COMMIT" 2>/dev/null || true
                git checkout "$UPSTREAM_COMMIT" 2>/dev/null || git checkout "$FETCH_HEAD"
              fi
              echo "Upstream commit: $(git rev-parse HEAD)"
              ls -la patches/mesa/
              
              echo "=== Extracting Mesa source (from cache) ==="
              cd /tmp
              tar xf /mesa.tar.gz
              MESA_DIR=$(ls -d mesa-mesa-* | head -1)
              cd "$MESA_DIR"
              echo "Mesa source ready."
              
              echo "=== Applying patches ==="
              SERIES="/upstream-fix/patches/mesa/series"
              while IFS= read -r line; do
                [[ "$line" =~ ^[[:space:]]*# ]] && continue
                [[ -z "${line// /}" ]] && continue
                
                PATCH_FILE="/upstream-fix/patches/mesa/$(echo "$line" | xargs)"
                echo "Applying: $(basename "$PATCH_FILE")"
                patch -p1 < "$PATCH_FILE"
              done < "$SERIES"
              echo "All Mesa patches applied."
              
              echo "=== Configuring build (RADV only) ==="
              DESTDIR="/output"
              PREFIX="/opt/bc250-gfx1013"
              
              meson setup build \
                -Dvulkan-drivers=amd \
                -Dgallium-drivers= \
                -Dglx=disabled \
                -Dllvm=disabled \
                -Dbuildtype=release \
                -Dprefix="$PREFIX"
              
              echo "=== Building ==="
              ninja -C build
              
              echo "=== Installing to DESTDIR ==="
              DESTDIR="$DESTDIR" ninja -C build install
              
              ICD_SRC="$DESTDIR/$PREFIX/share/vulkan/icd.d/radeon_icd.x86_64.json"
              if [[ -f "$ICD_SRC" ]]; then
                cp "$ICD_SRC" /output/radeon_icd.x86_64.json
                echo "ICD manifest copied."
              fi
              
              echo "=== Build complete ==="
              du -sh "$DESTDIR/$PREFIX/"
            '
          
          ls -lh output/

      - name: Upload RADV artifact
        uses: actions/upload-artifact@v4
        with:
          name: radv-patched
          path: output/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Stage 4: Verification
  # ──────────────────────────────────────────────
  verify:
    name: Verify builds
    needs: [detect-changes, build-kernel, build-mesa]
    if: always() && (needs.build-kernel.result == 'success' || needs.build-mesa.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download amdgpu.ko (if built)
        uses: actions/download-artifact@v4
        with:
          name: amdgpu-patched
          path: output/
        continue-on-error: true

      - name: Download RADV (if built)
        uses: actions/download-artifact@v4
        with:
          name: radv-patched
          path: output/
        continue-on-error: true

      - name: Verify artifacts
        run: |
          echo "=== Verification ==="
          echo ""
          
          if [[ -f "output/amdgpu.ko" ]]; then
            echo "✅ amdgpu.ko present"
            file output/amdgpu.ko
          else
            echo "⚠️  amdgpu.ko not built"
          fi
          
          echo ""
          
          if [[ -d "output/opt" ]]; then
            echo "✅ RADV installed to output/opt/"
            find output/opt/ -type f | head -20
          else
            echo "⚠️  RADV not built"
          fi
          
          if [[ -f "output/radeon_icd.x86_64.json" ]]; then
            echo "✅ Vulkan ICD manifest:"
            cat output/radeon_icd.x86_64.json
          fi
          
          echo ""
          echo "=== Phase 0 validation complete ==="

  # ──────────────────────────────────────────────
  # Save digests for next run
  # ──────────────────────────────────────────────
  save-digests:
    name: Save build digests
    needs: [detect-changes, verify]
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save current digests
        run: |
          mkdir -p .base-digests
          echo "${{ needs.detect-changes.outputs.base_kernel }}" > .base-digests/previous-kernel.txt
          echo "${{ needs.detect-changes.outputs.base_mesa }}" > .base-digests/previous-mesa.txt
          PINNED=$(grep -v '^#' upstream-commit.txt | grep -v '^$' | awk '{print $1}')
          echo "$PINNED" > .base-digests/previous-upstream.txt
          echo "Digests saved."

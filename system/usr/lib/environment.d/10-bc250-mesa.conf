# Pin Vulkan loader to our patched RADV driver.
# Stock Mesa lives at /usr/share/vulkan/icd.d/radeon_icd.x86_64.json
# Our patched Mesa lives at /opt/bc250-gfx1013/share/vulkan/icd.d/radeon_icd.x86_64.json
# Without this pin, apps may silently use the stock (broken) driver.
VK_DRIVER_FILES=/opt/bc250-gfx1013/share/vulkan/icd.d/radeon_icd.x86_64.json
